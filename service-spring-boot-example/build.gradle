plugins {
    id 'application'
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

// UPDATE THIS
mainClassName = 'com.kiwiko.jdashboard.springbootexample.service.app.SpringBootExampleServiceApplication'

description = 'Spring Boot Example Service'
group = 'com.kiwiko.jdashboard.springbootexample.service'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

jar {
    enabled = false
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.kiwiko.jdashboard.framework:data-access'
    implementation 'jakarta.inject:jakarta.inject-api'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}